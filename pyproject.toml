[project]
name = "frametop"
version = "0.1.0"
description = "Desktops in VR on the Steam Frame"
readme = "README.md"
requires-python = ">=3.12"

# Frametop's Python dependencies, locked in uv.lock. The Frame runs the Python
# that needs more than the host's python3 in a Flatpak on KDE's runtime
# (pack/flatpak, pack/host-and-flatpak.md): the apps group's PySide6 is the
# runtime's Qt minor, with Kirigami and the desktop style coming from the
# runtime itself, the tracker group is the eye and hand trackers' NumPy/OpenCV
# stack, and the voice group Frametop Voice's. The build image installs the
# dev, tracker and voice groups for the test gate.
[dependency-groups]
# Frametop Display Settings, Input Settings, Remote Displays, the Tour, the
# recorders and the Gaze Bench
apps = [
    "PySide6-Essentials>=6.11,<6.12",
]
dev = [
    "pytest>=8",
    "ruff>=0.14",
    "pyflakes>=3.4",
]
# type checking is dev tooling outside the image and the Flatpak
types = [
    "mypy>=1.19",
]
tracker = [
    "numpy>=2.2",
    "opencv-python-headless>=4.11",
    "huggingface_hub>=0.34",
    # the eye recorder's export encrypts with age (recorder/age.py), written on cryptography
    "cryptography>=42",
    # the eye net (gaze/tracker/eyes_net.py); gaze/tracker/requirements.txt has the same version
    "ncnn==1.0.20260526",
]
# Frametop Voice (voice/ft-voiced): Moonshine, the wake word spotter and Silero VAD run
# through sherpa-onnx; sentencepiece spells out wake phrases (voice/requirements.txt has the
# same versions, for the dev container). sherpa-onnx's wheels need sherpa-onnx-core of the
# same version (onnxruntime and its C++ side), but don't all say so, and uv locks without it:
# both are named here, at one version.
voice = [
    "numpy>=2.2",
    "sentencepiece>=0.2.2",
    "sherpa-onnx==1.13.8",
    "sherpa-onnx-core==1.13.8",
]

[tool.uv]
package = false
# ncnn's wheel asks for opencv-python, the GUI build of the cv2 that opencv-python-headless
# already provides; the two can't share one environment, and `import ncnn` doesn't use it.
override-dependencies = ["opencv-python; sys_platform == 'never'"]

# The lint gate (`just lint`, part of `just test`): ruff's classic rule set, named here so a newer
# ruff with a wider default set doesn't change what fails. Errors (E4, E7, E9) and pyflakes (F).
# Left out on purpose, as the code's own style: one-line statements (E701, E702; the table-style
# tests and tools use them), named lambdas (E731), several imports on one line (E401) and the
# names l/I/O (E741).
[tool.ruff]
# requires-python's floor (3.12), not the image's 3.14: the host-side scripts run on the
# Frame's system Python, so syntax newer than 3.12 fails the lint.
target-version = "py312"
# Build outputs hold other projects' Python (whisper.cpp's scripts under voice/build): a
# checkout the builds ran in is linted like a clean one.
extend-exclude = ["build"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
ignore = ["E401", "E701", "E702", "E731", "E741"]
