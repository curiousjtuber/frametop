[project]
name = "frametop"
version = "0.1.0"
description = "Desktops in VR on the Steam Frame"
readme = "README.md"
requires-python = ">=3.12"

# Frametop's Python dependencies, locked in uv.lock. The Frame runs the Python
# that needs more than the host's python3 in a Flatpak on KDE's runtime
# (pack/flatpak, pack/host-and-flatpak.md): the apps group's PySide6 is the
# runtime's Qt minor, with Kirigami and the desktop style coming from the
# runtime itself, and the tracker group is the eye and hand trackers'
# NumPy/OpenCV stack. The dev group is CI's tooling.
[dependency-groups]
# Frametop Display Settings, Input Settings, Remote Displays, the Hand Recorder
apps = [
    "PySide6-Essentials>=6.11,<6.12",
]
dev = [
    "pytest>=8",
    "ruff>=0.14",
    "pyflakes>=3.4",
]
# type checking is dev tooling outside the image: the image installs the
# default groups (dev for CI's pytest/ruff, tracker for the hand tracker)
# but not this one
types = [
    "mypy>=1.19",
]
tracker = [
    "numpy>=2.2",
    "opencv-python-headless>=4.11",
    "huggingface_hub>=0.34",
]

[tool.uv]
package = false
