# Build Frametop's release on Depot's arm64 runners (the Frame is aarch64): the build image
# from pack/Containerfile, the test gate inside it, the built tree copied out of it and checked
# against the glibc floor, the Python runtime Flatpak (pack/flatpak/build.sh, on the runner),
# the suites that need KDE in that Flatpak, then Frametop.zip (framedrop/build.sh): the tree,
# the bundle and the installer. FrameDrop installs it from a PC, or you unpack it on the
# headset and run Frametop/frametop-install.sh, or get.sh --release downloads it
# (pack/README.md, Releases). A few hundred MB, under GitHub's 2 GB a file.
#
# A v* tag makes a draft GitHub release with the zip, its FrameDrop manifest, its
# frametop-release.json, the Flatpak bundle on its own, and SHA256SUMS (a prerelease when the
# tag has a "-", like v0.3.0-exp.1). Nothing is public until someone publishes the draft. A
# manual run keeps the zip as the run's artifact for a week.
#
# Not on pushes or pull requests: Depot's runners are paid, and a fork's pull request would
# run on them. Actions are pinned to commit SHAs (the version in the comment).
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write  # the draft release

concurrency:
  group: release-${{ github.ref }}

jobs:
  release:
    runs-on: depot-ubuntu-24.04-arm-4
    timeout-minutes: 120
    env:
      FT_ENGINE: podman
      APP: io.github.frametop.Frametop
    steps:
      # actions/checkout@v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: version
        run: |
          if [ "$GITHUB_REF_TYPE" = tag ]; then v=${GITHUB_REF_NAME#v}; else v=0.0.0-ci.${GITHUB_SHA::7}; fi
          echo "VERSION=$v" >> "$GITHUB_ENV"
          echo "FT_IMAGE=localhost/frametop:$v" >> "$GITHUB_ENV"

      - name: build the image
        run: ./ft dev build

      # The unit gate: Python (strict), C, keyboard and shell, inside the image, so what passes
      # here is what the zip installs. The suites that need KDE run in the Flatpak, below.
      - name: test (python, c, bash)
        run: ./ft dev test

      # The tree a release ships: the image's /src/frametop, built. Every program within the
      # glibc floor (scripts/host-glibc.sh), as the builds checked already, once more here.
      - name: the built tree (what a release ships)
        run: |
          podman create --name tree "$FT_IMAGE" true >/dev/null
          mkdir -p out
          podman cp tree:/src/frametop out/tree
          podman rm tree >/dev/null
          cd out/tree
          programs="screens/build/ft-screens screens/build/ft-handview screens/build/ft-spotpanel
            pointer/helper/build/ft-pointer pointer/driver/build/driver_ft_pointer.so power/build/ft-powerd
            gaze/build/ft-gaze gaze/build/ft-gazepanel gaze/tracker/build/ft-eyegrab stream/build/ft-stream
            layout/countdown/build/ft-reset-timer keyboard/build/frametop/framekeyboard
            keyboard/build/frametop/framekeyboard-native-guard voice/build/bin/whisper-server
            hands/build/ft-camd hands/build/ft-hands hands/rec/build/ft-handpanel"
          for p in $programs; do test -f "$p"; done
          hands/models.sh check
          . scripts/host-glibc.sh
          host_glibc_check $programs keyboard/build/frametop/engines/*.so
          du -sh .

      # The Python runtime: flatpak-builder on the runner (bubblewrap needs unprivileged user
      # namespaces, which Ubuntu 24.04's AppArmor restricts by default).
      - name: the Flatpak
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends flatpak flatpak-builder zstd just
          sudo sysctl -q kernel.apparmor_restrict_unprivileged_userns=0
          pack/flatpak/build.sh
          ls -la pack/flatpak/build/frametop.flatpak

      # The suites that need KDE (PySide6, kwriteconfig6), in the runtime they ship in, with
      # the pytest it carries for this (justfile test-kde, from the checkout).
      - name: test (kde, in the flatpak)
        run: |
          flatpak install --user -y --noninteractive pack/flatpak/build/frametop.flatpak >/dev/null
          just test-kde

      # The FrameDrop manifest names the zip's URL in this repo's release (a fork's, in a fork).
      - name: Frametop.zip
        run: |
          url=()
          [ "$GITHUB_REF_TYPE" = tag ] &&
            url=("https://github.com/$GITHUB_REPOSITORY/releases/download/$GITHUB_REF_NAME/Frametop.zip")
          framedrop/build.sh --tree out/tree --flatpak pack/flatpak/build/frametop.flatpak \
            --version "$VERSION" --commit "$GITHUB_SHA" "${url[@]}"

      - name: keep the zip (manual runs)
        if: github.ref_type != 'tag'
        # actions/upload-artifact@v7.0.2
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: Frametop-${{ env.VERSION }}
          path: framedrop/build/
          retention-days: 7

      - name: draft release (tags)
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          pre=() notes=pack/release-notes.md
          if [[ $VERSION == *-* ]]; then
            pre=(--prerelease)
            # get.sh --release asks for a channel and offers stable first: an experimental
            # release's install line names its channel.
            notes=$RUNNER_TEMP/release-notes.md
            sed 's/bash -s -- --release`/bash -s -- --release --experimental`/' pack/release-notes.md >"$notes"
            grep -q -- '--release --experimental`' "$notes" ||
              echo "::warning::pack/release-notes.md has no get.sh --release line to mark experimental"
          fi
          gh release create "$GITHUB_REF_NAME" --draft --verify-tag "${pre[@]}" \
            --title "Frametop $VERSION" --notes-file "$notes" --generate-notes \
            framedrop/build/Frametop.zip framedrop/build/frametop.framedrop.json \
            framedrop/build/frametop-release.json framedrop/build/frametop.flatpak framedrop/build/SHA256SUMS
